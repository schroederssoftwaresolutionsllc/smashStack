plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
   id "com.google.gms.google-services"  // Google Services plugin

   id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Real AdMob application ID for release builds. Set it in
// android/gradle.properties as ADMOB_APP_ID=ca-app-pub-...~..., or pass
// -PADMOB_APP_ID=... on the command line.
def admobAppIdProd = project.findProperty('ADMOB_APP_ID')

android {
    namespace "com.schroederssoftwaresolutions.smashstack"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.schroederssoftwaresolutions.smashstack"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Google's public sample AdMob app ID, correct for development.
        // Overridden below for release builds.
        manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
    }

   signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }

    buildTypes {
        release {
            manifestPlaceholders = [admobAppId: admobAppIdProd ?: '']

            // Use the real upload key when android/key.properties is present.
            // Falls back to debug signing so `flutter run --release` still works locally.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
}

// Google's sample AdMob app ID must never ship in a release build: users would
// see "Test Ad" placeholders and the binary would carry another publisher's
// identifier. This check runs only when a release task is actually in the
// graph, so debug builds and `flutter run` are unaffected.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { it.name.toLowerCase().contains('release') }
    if (buildingRelease && !admobAppIdProd) {
        throw new GradleException(
            "ADMOB_APP_ID is not set, so this release build would ship Google's sample AdMob app ID.\n\n" +
            "Create the app in AdMob (answer \"No\" to the app-store-listing question if it is not\n" +
            "published yet) and add its application ID to android/gradle.properties:\n\n" +
            "    ADMOB_APP_ID=ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY\n\n" +
            "Production ad unit IDs go in lib/services/ad_config.dart. If those are left blank the\n" +
            "app builds and runs with ads switched off, which is a safe way to ship without ads.\n")
    }
}
