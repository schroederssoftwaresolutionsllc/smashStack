plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
   id "com.google.gms.google-services"  // Google Services plugin

   id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def trimQuotes(val) {
    if (val == null) return null
    def s = val.toString().trim()
    if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) {
        s = s.substring(1, s.length() - 1).trim()
    }
    return s.isEmpty() ? null : s
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStoreFile = trimQuotes(keystoreProperties['storeFile']) ?:
    trimQuotes(project.findProperty('ANDROID_STORE_FILE')) ?:
    trimQuotes(System.getenv('ANDROID_STORE_FILE')) ?:
    trimQuotes(System.getenv('CM_KEYSTORE_PATH'))

def releaseStorePassword = trimQuotes(keystoreProperties['storePassword']) ?:
    trimQuotes(project.findProperty('ANDROID_STORE_PASSWORD')) ?:
    trimQuotes(System.getenv('ANDROID_STORE_PASSWORD')) ?:
    trimQuotes(System.getenv('CM_KEYSTORE_PASSWORD'))

def releaseKeyAlias = trimQuotes(keystoreProperties['keyAlias']) ?:
    trimQuotes(project.findProperty('ANDROID_KEY_ALIAS')) ?:
    trimQuotes(System.getenv('ANDROID_KEY_ALIAS')) ?:
    trimQuotes(System.getenv('CM_KEY_ALIAS'))

def releaseKeyPassword = trimQuotes(keystoreProperties['keyPassword']) ?:
    trimQuotes(project.findProperty('ANDROID_KEY_PASSWORD')) ?:
    trimQuotes(System.getenv('ANDROID_KEY_PASSWORD')) ?:
    trimQuotes(System.getenv('CM_KEY_PASSWORD')) ?:
    releaseStorePassword

def hasValidReleaseSigning = releaseStoreFile &&
    file(releaseStoreFile).exists() &&
    releaseStorePassword &&
    releaseKeyAlias &&
    releaseKeyPassword

// Google's sample AdMob application ID. Valid and correct for development,
// but it must not ship: real users would see "Test Ad" placeholders.
def ADMOB_SAMPLE_APP_ID = 'ca-app-pub-3940256099942544~3347511713'

// Real AdMob application ID for release builds. Set it in
// android/gradle.properties as ADMOB_APP_ID=ca-app-pub-...~..., or pass
// -PADMOB_APP_ID=... on the command line (including on CI).
def admobAppIdProd = project.findProperty('ADMOB_APP_ID')

android {
    namespace "com.schroederssoftwaresolutions.smashstack"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.schroederssoftwaresolutions.smashstack"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Google's public sample AdMob app ID, correct for development.
        // Overridden below for release builds.
        manifestPlaceholders = [admobAppId: ADMOB_SAMPLE_APP_ID]
    }

   signingConfigs {
       release {
           if (hasValidReleaseSigning) {
               keyAlias releaseKeyAlias
               keyPassword releaseKeyPassword
               storeFile file(releaseStoreFile)
               storePassword releaseStorePassword
           }
       }
   }

    buildTypes {
        release {
            // Never leave this empty: the Google Mobile Ads SDK validates
            // APPLICATION_ID in a ContentProvider at process start and crashes
            // the app on launch if it is blank. Fall back to the sample ID and
            // warn instead, so a misconfigured build is ugly rather than broken.
            manifestPlaceholders = [admobAppId: admobAppIdProd ?: ADMOB_SAMPLE_APP_ID]

            // Use the real upload key when valid keystore info and file are present.
            // Falls back to debug signing so `flutter run --release` still works locally or if signing is not configured.
            signingConfig hasValidReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Kotlin 2.3 raises an error on every kotlinOptions property, so the JVM
// target moves to the compilerOptions DSL. Kept at 1.8 to match the
// source/targetCompatibility set in the android block above.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.3.20"
}

// Warn loudly when a release build has no real AdMob application ID. This is a
// warning rather than a build failure so it cannot break CI; the trade-off is
// that the sample ID ships if the warning is ignored. Gated on a release task
// actually being in the graph, so debug builds and `flutter run` stay quiet.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { it.name.toLowerCase().contains('release') }
    if (buildingRelease && !admobAppIdProd) {
        logger.warn("")
        logger.warn("=" * 78)
        logger.warn("WARNING: ADMOB_APP_ID is not set, so this RELEASE build is using")
        logger.warn("Google's sample AdMob app ID. Users would see \"Test Ad\" placeholders.")
        logger.warn("")
        logger.warn("Fix: create the app in AdMob (answer \"No\" to the app-store-listing")
        logger.warn("question if it is not published yet) and set its application ID in")
        logger.warn("android/gradle.properties, or pass -PADMOB_APP_ID=... on CI:")
        logger.warn("")
        logger.warn("    ADMOB_APP_ID=ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY")
        logger.warn("")
        logger.warn("Production ad unit IDs go in lib/services/ad_config.dart. While those")
        logger.warn("are blank the app runs with ads switched off, which ships safely.")
        logger.warn("=" * 78)
        logger.warn("")
    }
}
